<!DOCTYPE html>
<html lang="en">

    <title>Temperature Blanket</title>
</head>

<body class="body" id="body">
    
<header class="header" id="header">
    <h1 class="title" id="title">Temperature Blanket Generator</h1>

            </ul></nav> -->
</header>

<main class="main" id="main">
    <div class="FormContainer">
        <form action="" id="DataForm">
            <div id="DataForm__data_inputs">
                <!-- <label for="DataForm__zipCode">Zip Code</label>
                <input type="number" name="" id="zipCode" required /><br> -->

                <label for="DataForm__city">City</label>
                <input type="text" name="" id="DataForm__city" required /><br>
                
                <label for="DataForm__year">Year</label>
                <input type="text" name="" id="DataForm__year" required /><br>

                <label for="DataForm__tempScale">Temperature Scale</label>
                <select id="DataForm__tempScale" name="" required>
                    <option value="fahrenheit">Fahrenheit</option>
                    <option value="celsius">Celsius</option>
                </select><br>
            </div>
            <br>
            <br>
            <!-- color selectors -->
            <!-- <label for="DataForm__color-total"></label>
            <input type="text" name="" id="color-total" required /> -->
            <!-- will need to work that information into a formula that auto generates the following -->
            <div id="DataForm__color_inputs">
                <label for="color1">Low Temp</label>
                <input type="color" name="" id="color1" value="#577590" required />
                <!-- <label for="color2">Color 2</label> -->
                <input type="color" name="" id="color2" value="#4d908e" required />
                <!-- <label for="color3">Color 3</label> -->
                <input type="color" name="" id="color3" value="#43aa8b" required />
                <!-- <label for="color4">Color 4</label> -->
                <input type="color" name="" id="color4" value="#90be6d" required />
                <!-- <label for="color5">Color 5</label> -->
                <input type="color" name="" id="color5" value="#f9c74f" required />
                <!-- <label for="color6">Color 6</label> -->
                <input type="color" name="" id="color6" value="#f8961e" required />
                <!-- <label for="color7">Color 7</label> -->
                <input type="color" name="" id="color7" value="#f3722c" required />
                <input type="color" name="" id="color8" value="#f94144" required />
                <label for="color8">High Temp</label>
            </div>
            <br>
            <input type="submit" value="Submit">
        </form>
    </div>
    
    <div id="SearchResults">
    </div>

    <div class="BlanketPreview">
        <!-- Append children x# of rows with #row class
        How to assign color for each row?-->

        <svg id="blanketPreviewImage" height="732">

        </svg>


    </div>
</main>

<footer class="footer" id="footer">Happy creating!</footer>
